# Build wheels for every supported platform and publish to PyPI.
#
# The filename matters: the PyPI Trusted Publisher for d810-cobra is
# registered against `deploy.yml` on this repository. Renaming this file breaks
# publishing with an authentication error that looks nothing like the cause.
name: deploy

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            publish:
                description: "Upload to PyPI (otherwise build only)"
                required: false
                default: false
                type: boolean

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build_wheels:
        name: ${{ matrix.os }}
        runs-on: ${{ matrix.runs-on }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { os: linux, runs-on: ubuntu-latest }
                    # aarch64 matters for real: the d810 test-runtime image is
                    # arm64/linux, so an x86_64-only linux wheel falls through
                    # to the sdist there and fails without LLVM present.
                    - { os: linux-arm64, runs-on: ubuntu-24.04-arm }
                    - { os: windows, runs-on: windows-latest }
                    - { os: macos-arm64, runs-on: macos-latest }
                    - { os: macos-x86_64, runs-on: macos-15-intel }

        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            # MSVC must be on PATH before CMake configures anything. `-G Ninja`
            # with no compiler pinned takes the first compiler in PATH, which on
            # this runner is MinGW -- that produces libabsl_*.a, which the MSVC
            # extension can neither /WHOLEARCHIVE: nor safely link against.
            # build_cobra.py additionally pins CMAKE_C/CXX_COMPILER=cl so a
            # missing MSVC fails at configure rather than silently producing
            # archives in the wrong toolchain.
            - name: Set up MSVC
              if: runner.os == 'Windows'
              uses: ilammy/msvc-dev-cmd@v1

            - name: cmake + ninja (manylinux container has neither)
              if: runner.os == 'Linux'
              run: pipx install cmake ninja || pip install cmake ninja

            # NOT continue-on-error. In d810 this step was soft-failing, and
            # because the release gate keyed off its outcome, a failed build
            # disarmed the very check meant to catch it -- wheels shipped with
            # no binding and CI stayed green. Here the binding IS the package,
            # so a failure must stop the build.
            # Linux builds inside a manylinux container, so the libraries must
            # be built THERE. Building them on the host and linking them in the
            # container produced a wheel that compiled, linked, passed auditwheel
            # and then failed to dlopen -- caught only by the import gate below.
            # See CIBW_BEFORE_ALL_LINUX.
            - name: Build CoBRA static libs
              if: runner.os != 'Linux'
              run: python tools/build_cobra.py

            - uses: pypa/cibuildwheel@v3.1
              env:
                  # cibuildwheel tests a wheel by `pip install`ing it, which
                  # resolves runtime dependencies. This package requires
                  # d810-ng>=1.0.0b0, which is not on PyPI, so that install
                  # fails on the dependency and never reaches the binding --
                  # reporting a packaging fact as a build failure. The binding
                  # needs no d810 to be exercised, so the TEST install skips
                  # dependencies (pip reads PIP_NO_DEPS natively).
                  #
                  # CIBW_TEST_ENVIRONMENT, not the step's `env:`. Setting
                  # PIP_NO_DEPS at step level also applies to the action's own
                  # bootstrap, which pip-installs cibuildwheel -- stripping its
                  # dependencies broke it before it ever ran:
                  #     ModuleNotFoundError: No module named 'pathspec'
                  # This option is scoped to the test environment alone, and it
                  # reaches the manylinux container without a PASS_LINUX entry.
                  CIBW_TEST_ENVIRONMENT: PIP_NO_DEPS=1
                  CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
                  CIBW_SKIP: "*-win32 *-musllinux_*"
                  CIBW_ENVIRONMENT: >-
                      COBRA_ROOT=/project/third_party/cobra
                  CIBW_ENVIRONMENT_WINDOWS: >-
                      COBRA_ROOT=$GITHUB_WORKSPACE\\third_party\\cobra
                  CIBW_ENVIRONMENT_MACOS: >-
                      COBRA_ROOT=$GITHUB_WORKSPACE/third_party/cobra
                  CIBW_BEFORE_BUILD: "pip install Cython>=3.0.0"
                  # Built INSIDE the manylinux container, against the same
                  # toolchain and libstdc++ that will load the extension. The
                  # host-built variant linked cleanly and then failed at dlopen.
                  CIBW_BEFORE_ALL_LINUX: >-
                      pip install cmake ninja && python tools/build_cobra.py
                  # The only check that distinguishes a working wheel from one
                  # that installs cleanly and does nothing. It runs a real
                  # known-answer solve rather than reading binding_available():
                  # a compiled extension can import and still be mis-wired, and
                  # a boolean cannot tell those apart. See tools/verify_binding.py.
                  CIBW_TEST_COMMAND: python {project}/tools/verify_binding.py

            - uses: actions/upload-artifact@v4
              with:
                  name: wheels-${{ matrix.os }}
                  path: ./wheelhouse/*.whl
                  retention-days: 30

    build_sdist:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive
            # An sdist packs sources; it compiles nothing, so this job
            # deliberately has no CoBRA build step. setuptools nonetheless
            # evaluates ext_modules on every PEP 517 hook, so setup.py needs to
            # be told that skipping the extension is intended here -- see the
            # note on SDIST_ONLY in setup.py for why this is opt-in rather than
            # a silent fallback.
            - run: pipx run build --sdist
              env:
                  D810_COBRA_SDIST_ONLY: "1"
            - uses: actions/upload-artifact@v4
              with:
                  name: sdist
                  path: ./dist/*.tar.gz

    publish:
        needs: [build_wheels, build_sdist]
        runs-on: ubuntu-latest
        if: github.event_name == 'release' || inputs.publish
        # No `environment:` on purpose. The PyPI Trusted Publisher for this
        # project is registered WITHOUT an environment, and the environment is
        # part of what PyPI matches the OIDC token against. Declaring one here
        # puts an `environment` claim in the token that the publisher config
        # does not expect, and the failure surfaces as an authentication error
        # that says nothing about environments.
        #
        # If a publishing environment is ever wanted (worth it -- it gates who
        # can release independently of who can commit), register it on PyPI
        # FIRST, then add it here. The two must agree.
        permissions:
            # Required for PyPI Trusted Publishing (OIDC). Without it the
            # upload fails on permissions, not on credentials.
            id-token: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: dist
                  merge-multiple: true
            - uses: pypa/gh-action-pypi-publish@release/v1

    # Attach the same artifacts to the GitHub release. Without this the release
    # page lists no files at all and the wheels are findable only on PyPI, which
    # read as "no Windows wheel" to someone looking at the release.
    #
    # A separate job, not a step in `publish`, for two reasons. `publish` must
    # keep exactly `id-token: write` -- widening its permissions is not needed
    # for the upload -- and a failure here must not block the PyPI upload,
    # which is the release of record.
    release_assets:
        needs: [build_wheels, build_sdist]
        runs-on: ubuntu-latest
        if: github.event_name == 'release'
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: dist
                  merge-multiple: true
            # SHA256SUMS lets a downloader check a file against this run's
            # output without trusting the release page's own display.
            - name: Checksum
              working-directory: dist
              run: sha256sum -- * | tee SHA256SUMS
            - name: Upload to release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: >-
                  gh release upload "${{ github.event.release.tag_name }}"
                  dist/* --clobber --repo "${{ github.repository }}"
